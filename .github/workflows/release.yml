# Windows exe'lerini derler.
# - "v1.2.3" gibi bir etiket gönderilince: sürümü etiketten alır, derler, GitHub Release'e ekler ve mastertool.download'a yükler.
# - Actions sekmesinden elle çalıştırılınca (workflow_dispatch): yalnızca derler, exe'leri "artifact" olarak saklar.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Sürümü etiketten al
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm ci

      - run: npm test

      # Pencere paketi ve WASM kitaplıkları (src/renderer/gen/) — git'te yok, burada üretilir
      - run: npm run build

      - name: Exe'leri derle
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: Master-3D-windows
          path: dist/*.exe
          retention-days: 14

      - name: Release'e ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true

      # Exe kullanıcılara Hesabım ve Master Tool üzerinden dağıtılır (mastertool.download, uygulama kodu "m3").
      # Anahtar depo secret’ı MASTER_RELEASE_KEY’dedir (betiğe MASTER3D_RELEASE_KEY olarak verilir); tanımlı değilse adım atlanır.
      # Kurulum ve portable ayrı isteklerle parçalı gönderilir: sunucunun önündeki Cloudflare tek istekte en çok
      # 100 MB kabul ediyor. Ayrıntılar scripts/upload-master3d.sh.
      - name: mastertool.download'a yükle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          MASTER3D_RELEASE_KEY: ${{ secrets.MASTER_RELEASE_KEY }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          bash scripts/upload-master3d.sh "$V" "dist/Master-3D-Setup-$V.exe" "$(git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME")" "dist/Master-3D-Portable-$V.exe"
